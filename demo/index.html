<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamingVLM Live Commentary Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 1.2rem;
      color: #fff;
    }

    h1 span {
      color: #e05050;
    }

    .video-wrapper {
      position: relative;
      width: 90vw;
      max-width: 1280px;
    }

    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      display: block;
    }

    .controls {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 90vw;
      max-width: 1280px;
    }

    button {
      padding: 0.6rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      background: #e05050;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #c03030; }
    button:disabled { background: #555; cursor: default; }

    #status {
      font-size: 0.9rem;
      color: #aaa;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      margin-right: 6px;
      vertical-align: middle;
    }
    .dot.running { background: #4caf50; animation: pulse 1s infinite; }
    .dot.loading { background: #ff9800; animation: pulse 0.6s infinite; }
    .dot.done    { background: #4caf50; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    #cue-count {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.4rem;
    }

    #commentary-box {
      width: 90vw;
      max-width: 1280px;
      margin-top: 1rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      height: 260px;
      overflow-y: auto;
      font-size: 1rem;
      line-height: 1.6;
      color: #e8e8e8;
    }

    #commentary-text {
      white-space: pre-wrap;
    }

    #commentary-placeholder {
      color: #555;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>StreamingVLM <span>Live Commentary</span></h1>

  <div class="video-wrapper">
    <video id="v" controls>
      <source src="/video" type="video/mp4">
      Your browser does not support the video element.
    </video>
  </div>

  <div class="controls">
    <button id="startBtn" onclick="startDemo()">Start Inference</button>
    <div>
      <div id="status"><span class="dot" id="dot"></span>Click Start to begin</div>
      <div id="cue-count"></div>
    </div>
  </div>

  <div id="commentary-box">
    <span id="commentary-placeholder">Commentary will appear here once inference starts...</span>
    <span id="commentary-text"></span>
  </div>

  <script>
    const video = document.getElementById('v');
    const statusEl = document.getElementById('status');
    const dotEl = document.getElementById('dot');
    const cueCountEl = document.getElementById('cue-count');
    const startBtn = document.getElementById('startBtn');
    const commentaryBox = document.getElementById('commentary-box');
    const commentaryText = document.getElementById('commentary-text');
    const commentaryPlaceholder = document.getElementById('commentary-placeholder');

    let pollInterval = null;
    let lastCueCount = 0;
    let renderedCues = 0;

    async function startDemo() {
      startBtn.disabled = true;
      setStatus('loading', 'Starting inference (loading model ~1 min)...');

      try {
        const resp = await fetch('/start', { method: 'POST' });
        const data = await resp.json();
        console.log('Start response:', data);
      } catch (e) {
        setStatus('error', 'Failed to start inference: ' + e.message);
        startBtn.disabled = false;
        return;
      }

      // Start polling for subtitles
      pollInterval = setInterval(pollSubtitles, 500);

      // Start polling status separately to detect model-loaded state
      setTimeout(waitForFirstCue, 2000);
    }

    async function waitForFirstCue() {
      // Poll /status until we see the first cue written, then start playing
      try {
        const resp = await fetch('/status');
        const data = await resp.json();
        if (data.cues > 0) {
          setStatus('running', 'Inference running...');
          video.play();
        } else if (data.running) {
          setStatus('loading', 'Model loaded, waiting for first cue...');
          setTimeout(waitForFirstCue, 1000);
        } else {
          setTimeout(waitForFirstCue, 1000);
        }
      } catch (e) {
        setTimeout(waitForFirstCue, 2000);
      }
    }

    async function pollSubtitles() {
      try {
        const resp = await fetch('/subtitles.vtt?t=' + Date.now());
        if (!resp.ok) return;
        const vttText = await resp.text();

        // Parse cue texts from VTT — extract lines that are not timestamps,
        // not "WEBVTT", and not blank
        const lines = vttText.split('\n');
        const cueTexts = [];
        let inCue = false;
        for (const line of lines) {
          const trimmed = line.trim();
          if (trimmed.includes('-->')) {
            inCue = true;
            continue;
          }
          if (trimmed === '' ) {
            inCue = false;
            continue;
          }
          if (inCue && trimmed !== 'WEBVTT' && trimmed !== '...') {
            // Strip trailing " ..." that the model appends to most cues
            const cleaned = trimmed.replace(/\s*\.\.\.\s*$/, '').trim();
            if (cleaned) cueTexts.push(cleaned);
          }
        }

        const totalCues = cueTexts.length;

        // Update cue count display
        if (totalCues !== lastCueCount) {
          lastCueCount = totalCues;
          cueCountEl.textContent = `${totalCues} cue${totalCues !== 1 ? 's' : ''} generated`;
        }

        // Append only new cues since last render
        if (totalCues > renderedCues) {
          const newCues = cueTexts.slice(renderedCues);
          if (renderedCues === 0) {
            commentaryPlaceholder.style.display = 'none';
            commentaryText.textContent = newCues.join(' ');
          } else {
            commentaryText.textContent += ' ' + newCues.join(' ');
          }
          renderedCues = totalCues;
          // Auto-scroll to bottom only if user is already near the bottom
          const nearBottom = commentaryBox.scrollHeight - commentaryBox.scrollTop - commentaryBox.clientHeight < 60;
          if (nearBottom) commentaryBox.scrollTop = commentaryBox.scrollHeight;
        }

        checkStatus();

      } catch (e) {
        // Network error — keep polling
      }
    }

    async function checkStatus() {
      try {
        const resp = await fetch('/status');
        const data = await resp.json();
        if (!data.running && lastCueCount > 0) {
          clearInterval(pollInterval);
          setStatus('done', `Done — ${lastCueCount} cues generated`);
        }
      } catch (e) {}
    }

    function setStatus(state, message) {
      dotEl.className = 'dot ' + (state === 'error' ? '' : state);
      statusEl.innerHTML = `<span class="dot ${state === 'error' ? '' : state}" id="dot"></span>${message}`;
    }
  </script>

</body>
</html>
