<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamingVLM Live Commentary Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 1.2rem;
      color: #fff;
    }

    h1 span { color: #e05050; }

    .video-wrapper {
      position: relative;
      width: 90vw;
      max-width: 1280px;
    }

    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      display: block;
    }

    .controls {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 90vw;
      max-width: 1280px;
      flex-wrap: wrap;
    }

    button {
      padding: 0.6rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      background: #e05050;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #c03030; }
    button:disabled { background: #555; cursor: default; }

    #cameraBtn {
      background: #2a6099;
    }
    #cameraBtn:hover { background: #1e4d7a; }
    #cameraBtn.active { background: #1a7a3a; }

    #status {
      font-size: 0.9rem;
      color: #aaa;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      margin-right: 6px;
      vertical-align: middle;
    }
    .dot.running { background: #4caf50; animation: pulse 1s infinite; }
    .dot.loading { background: #ff9800; animation: pulse 0.6s infinite; }
    .dot.done    { background: #4caf50; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    #cue-count {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.4rem;
    }

    #commentary-box {
      width: 90vw;
      max-width: 1280px;
      margin-top: 1rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      height: 260px;
      overflow-y: auto;
      font-size: 1rem;
      line-height: 1.6;
      color: #e8e8e8;
    }

    #commentary-text { white-space: pre-wrap; }

    #commentary-placeholder {
      color: #555;
      font-style: italic;
    }

    #visibility-warning {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #e05050;
      color: #fff;
      text-align: center;
      padding: 0.7rem 1rem;
      font-weight: 600;
      font-size: 1rem;
      z-index: 999;
    }
  </style>
</head>
<body>

  <div id="visibility-warning">⚠️ Keep this tab in the foreground — switching tabs pauses camera frame capture and will stop inference.</div>

  <h1>StreamingVLM <span>Live Commentary</span></h1>

  <div class="video-wrapper">
    <video id="v" controls>
      <source src="/video" type="video/mp4">
      Your browser does not support the video element.
    </video>
  </div>

  <div class="controls">
    <button id="startBtn" onclick="startDemo()">Start Inference</button>
    <button id="cameraBtn" onclick="toggleCamera()">Use Camera</button>
    <div>
      <div id="status"><span class="dot" id="dot"></span>Click Start to begin</div>
      <div id="cue-count"></div>
    </div>
  </div>

  <div id="commentary-box">
    <span id="commentary-placeholder">Commentary will appear here once inference starts...</span>
    <span id="commentary-text"></span>
  </div>

  <!-- Hidden canvas used to grab frames from camera -->
  <canvas id="frameCanvas" style="display:none" width="640" height="360"></canvas>

  <script>
    const video = document.getElementById('v');
    const statusEl = document.getElementById('status');
    const dotEl = document.getElementById('dot');
    const cueCountEl = document.getElementById('cue-count');
    const startBtn = document.getElementById('startBtn');
    const cameraBtn = document.getElementById('cameraBtn');
    const commentaryBox = document.getElementById('commentary-box');
    const commentaryText = document.getElementById('commentary-text');
    const commentaryPlaceholder = document.getElementById('commentary-placeholder');
    const frameCanvas = document.getElementById('frameCanvas');

    let pollInterval = null;
    let frameInterval = null;
    let lastCueCount = 0;
    let renderedCues = 0;
    let cameraStream = null;
    let cameraMode = false;
    let vttEndpoint = '/subtitles.vtt';

    // ── Camera toggle ──────────────────────────────────────────────────────────

    async function toggleCamera() {
      if (cameraMode) {
        // Turn off camera
        if (cameraStream) {
          cameraStream.getTracks().forEach(t => t.stop());
          cameraStream = null;
        }
        cameraMode = false;
        cameraBtn.textContent = 'Use Camera';
        cameraBtn.classList.remove('active');
        // Restore pre-recorded video source
        video.srcObject = null;
        video.src = '/video';
        video.load();
        setStatus('', 'Click Start to begin');
      } else {
        // Turn on camera
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        } catch (e) {
          alert('Camera access denied: ' + e.message);
          return;
        }
        cameraMode = true;
        cameraBtn.textContent = 'Stop Camera';
        cameraBtn.classList.add('active');
        // Show camera feed in video element
        video.srcObject = cameraStream;
        video.controls = false;
        video.play();
        vttEndpoint = '/camera-subtitles.vtt';
        setStatus('', 'Camera ready — click Start Inference');
      }
    }

    // ── Start inference ────────────────────────────────────────────────────────

    async function startDemo() {
      startBtn.disabled = true;
      resetCommentary();
      setStatus('loading', 'Starting inference (loading model ~1 min)...');

      const endpoint = cameraMode ? '/start-camera' : '/start';
      try {
        const resp = await fetch(endpoint, { method: 'POST' });
        await resp.json();
      } catch (e) {
        setStatus('error', 'Failed to start inference: ' + e.message);
        startBtn.disabled = false;
        return;
      }

      // In camera mode, start posting frames immediately
      if (cameraMode) {
        frameInterval = setInterval(postFrame, 1000);
      }

      pollInterval = setInterval(pollSubtitles, 500);
      setTimeout(waitForFirstCue, 2000);
    }

    // ── Frame capture & upload ─────────────────────────────────────────────────

    async function postFrame() {
      if (!cameraStream) return;
      const ctx = frameCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);
      frameCanvas.toBlob(async (blob) => {
        try {
          await fetch('/frame', {
            method: 'POST',
            headers: { 'Content-Type': 'image/jpeg', 'Content-Length': blob.size },
            body: blob,
          });
        } catch (_) {}
      }, 'image/jpeg', 0.85);
    }

    // ── Subtitle polling ───────────────────────────────────────────────────────

    async function waitForFirstCue() {
      try {
        const resp = await fetch('/status');
        const data = await resp.json();
        if (data.cues > 0) {
          setStatus('running', 'Inference running...');
          if (!cameraMode) video.play();
        } else if (data.running) {
          setStatus('loading', 'Model loaded, waiting for first cue...');
          setTimeout(waitForFirstCue, 1000);
        } else {
          setTimeout(waitForFirstCue, 1000);
        }
      } catch (e) {
        setTimeout(waitForFirstCue, 2000);
      }
    }

    async function pollSubtitles() {
      try {
        const resp = await fetch(vttEndpoint + '?t=' + Date.now());
        if (!resp.ok) return;
        const vttText = await resp.text();

        const lines = vttText.split('\n');
        const cueTexts = [];
        let inCue = false;
        for (const line of lines) {
          const trimmed = line.trim();
          if (trimmed.includes('-->')) { inCue = true; continue; }
          if (trimmed === '')          { inCue = false; continue; }
          if (inCue && trimmed !== 'WEBVTT' && trimmed !== '...') {
            const cleaned = trimmed.replace(/\s*\.\.\.\s*$/, '').trim();
            if (cleaned) cueTexts.push(cleaned);
          }
        }

        const totalCues = cueTexts.length;
        if (totalCues !== lastCueCount) {
          lastCueCount = totalCues;
          cueCountEl.textContent = `${totalCues} cue${totalCues !== 1 ? 's' : ''} generated`;
        }

        if (totalCues > renderedCues) {
          const newCues = cueTexts.slice(renderedCues);
          if (renderedCues === 0) {
            commentaryPlaceholder.style.display = 'none';
            commentaryText.textContent = newCues.join(' ');
          } else {
            commentaryText.textContent += ' ' + newCues.join(' ');
          }
          renderedCues = totalCues;
          const nearBottom = commentaryBox.scrollHeight - commentaryBox.scrollTop - commentaryBox.clientHeight < 60;
          if (nearBottom) commentaryBox.scrollTop = commentaryBox.scrollHeight;
        }

        checkStatus();
      } catch (e) {}
    }

    async function checkStatus() {
      try {
        const resp = await fetch('/status');
        const data = await resp.json();
        if (!data.running && lastCueCount > 0) {
          clearInterval(pollInterval);
          clearInterval(frameInterval);
          setStatus('done', `Done — ${lastCueCount} cues generated`);
        }
      } catch (e) {}
    }

    // ── Helpers ────────────────────────────────────────────────────────────────

    // ── Visibility warning ─────────────────────────────────────────────────────
    const visibilityWarning = document.getElementById('visibility-warning');
    document.addEventListener('visibilitychange', () => {
      if (cameraMode && frameInterval) {
        visibilityWarning.style.display = document.hidden ? 'block' : 'none';
      }
    });

    function resetCommentary() {
      commentaryText.textContent = '';
      commentaryPlaceholder.style.display = '';
      lastCueCount = 0;
      renderedCues = 0;
    }

    function setStatus(state, message) {
      statusEl.innerHTML = `<span class="dot ${state}" id="dot"></span>${message}`;
    }
  </script>

</body>
</html>
